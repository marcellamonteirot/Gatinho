<!DOCTYPE html>
<html>
<head>
<style>
body{
    margin:0;
    overflow:hidden;
    background:#87CEEB;
}

#cat{
    position:absolute;
    font-size:80px;
    top:50%;
    animation:walk 8s linear infinite;
}

@keyframes walk{
    from{
        left:-100px;
    }

    to{
        left:100%;
    }
}
</style>
</head>

<body>

<div id="cat">🐱</div>

</body>
</html>
